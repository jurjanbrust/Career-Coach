  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using @vitejs/plugin-react"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Preconnect vroeg naar de origins die anders pas na het laden/parsen van de
      JS-bundle worden aangesproken. Dit knipt hops uit de kritieke keten:
      HTML -> JS -> CSS(@import font) -> font-css -> font-bestand, en
      HTML -> JS -> eerste API-call.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dev-coach-backend.azurewebsites.net" crossorigin />
    <!-- Direct als <link> geladen i.p.v. via een @import in de CSS-bundle, zodat het
         font-stylesheet parallel aan de HTML start in plaats van pas na de JS/CSS-chunk. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" />
    <title>Career Coach</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('coach.theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="index-Ctx5YW6w.js"></script>
    <link rel="stylesheet" crossorigin href="index-B68cf4sU.css">
  </head>
